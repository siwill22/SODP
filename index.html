<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SODP -- Synthetic Core</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #0b0d10;
        color: #d8dee4;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 0.55rem 1rem;
        background: #14171b;
        border-bottom: 1px solid #3a4048;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      header h1 { font-size: 0.95rem; margin: 0; font-weight: 600; color: #eef1f4; }
      header p { margin: 0; font-size: 0.78rem; color: #97a3ad; }
      .control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #1b1f24;
        border: 1px solid #3a4048;
        border-radius: 6px;
        padding: 0.35rem 0.65rem;
        font-size: 0.78rem;
        color: #d8dee4;
        cursor: pointer;
      }
      .control:hover { background: #262b32; }
      .control:has(input:checked) { background: #223244; border-color: #4d6a85; }
      .control select {
        background: transparent;
        color: inherit;
        border: none;
        font: inherit;
        cursor: pointer;
      }
      .control input[type="checkbox"] { accent-color: #5b8dbd; }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #map-pane {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #map-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }
      #side-panel {
        width: 420px;
        flex-shrink: 0;
        background: #101317;
        border-left: 1px solid #3a4048;
        padding: 1rem;
        overflow-y: auto;
        font-size: 0.85rem;
      }
      #side-panel h2 { font-size: 0.95rem; margin-top: 0; color: #eef1f4; }
      #side-panel p { color: #b7c0c8; }
      #side-panel canvas { background: #1b1f24; border: 1px solid #3a4048; border-radius: 4px; display: block; width: 100%; }
      .chart-title { font-size: 0.72rem; color: #97a3ad; margin: 0.6rem 0 0.15rem; }
      #status { font-size: 0.78rem; color: #97a3ad; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <h1>SODP -- Synthetic Core</h1>
      <p id="status">loading present-day map...</p>
      <label class="control" style="margin-left: auto;">
        Projection:
        <select id="projection-select">
          <option value="equirectangular">Flat (Equirectangular)</option>
          <option value="orthographic">Globe (Orthographic) -- drag to rotate</option>
        </select>
      </label>
      <label class="control">
        <input type="checkbox" id="belt-toggle" />
        Option A: equatorial Radiolarian belt (Diesing-informed, ADR-0013)
      </label>
    </header>
    <main>
      <div id="map-pane">
        <canvas id="map-canvas"></canvas>
      </div>
      <div id="side-panel">
        <h2>Click a point in the ocean</h2>
        <div id="side-content">
          <p style="color: #97a3ad;">Down-core Lithology Class log appears here after a click.</p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
